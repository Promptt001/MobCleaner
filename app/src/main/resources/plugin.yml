---
name: MobCleaner
main: dev.promptt.mobcleaner.MobCleanerPlugin
version: 2.1.0-beta.1
api-version: '26.2'
description: Cleans up configured mobs in loaded chunks that are no longer within simulation distance of any online player.
author: promptt

commands:
  mobcleaner:
    description: Admin commands for MobCleaner.
    usage: /mobcleaner <help|reload|sweep>
    permission: mobcleaner.admin

permissions:
  mobcleaner.admin:
    description: Allows using /mobcleaner.
    default: op
